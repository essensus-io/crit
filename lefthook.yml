# https://github.com/evilmartians/lefthook
pre-commit:
  parallel: true
  jobs:
    - name: oxlint
      glob: "*.{js,ts,tsx,mjs,cjs}"
      run: pnpm oxlint --fix {staged_files}
      stage_fixed: true
    - name: oxfmt
      glob: "*.{js,ts,tsx,mjs,cjs,json,md,yml,yaml}"
      run: pnpm oxfmt --write {staged_files}
      stage_fixed: true
